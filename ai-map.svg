<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">AI 产品全流程与控量系统演进</title>
<desc id="desc">完整流程包括需求场景、知识检索与 RAG、模型选择推理训练、工作流与 Agent 工具、评测业务校验、应用部署运维、反馈迭代。深绿表示本人产品工作，描边表示协作实现，灰色表示尚未有主责经验。下方演进从已上线但待正式场景应用的任务创建，走向尚未上线的监控诊断方案、调参建议与验证探索，以及未来的实验复盘反馈和自迭代闭环。未表示自动生产调参或模型自动学习已经部署。</desc>
